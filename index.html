  To make everyone who opens this page (e.g. via GitHub Pages) see the

    1. Go to https://console.firebase.google.com → Create project

    3. Project settings → General → "Your apps" → Web app → copy the
       firebaseConfig object
    4. Paste those values into FIREBASE_CONFIG below (search for it)
    5. Re-upload/commit this file — sync turns on automatically

  Note: test-mode rules are open (anyone with the link can read/write).

<style>
:root{
  --ink:#14171f;--navy:#1b2436;--accent:#ef7d1a;--accent-dark:#c9640f;
  --bg:#f3f4f8;--panel:#ffffff;--panel2:#f8f5f0;--muted:#6b7280;--line:#e6e8ee;
  --green:#1fae5c;--green-bg:#e8f8ee;--blue:#229ED9;--blue-bg:#e7f4fb;--red:#d94f30;--red-bg:#fdece7;
  --purple:#7c4fd9;--purple-bg:#efe9fb;
  --radius:16px;--shadow:0 8px 24px rgba(20,23,31,.08);
  font-family:'Hind Siliguri','Manrope',system-ui,sans-serif;
}
body.dark{--bg:#0e1117;--panel:#171b24;--panel2:#1c212c;--ink:#eef0f4;--muted:#9aa3b2;--line:#2a3040;--shadow:0 10px 26px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:'Manrope','Hind Siliguri',sans-serif;margin:0}
.header{background:var(--navy);color:#fff;padding:18px 18px 54px}
.brandrow{display:flex;align-items:center;gap:12px;max-width:1000px;margin:0 auto}
.logo{width:46px;height:46px;object-fit:contain;flex-shrink:0}
.brandtxt b{display:block;font-size:18px;letter-spacing:.3px}
.brandtxt span{display:block;font-size:12px;opacity:.65}
.headerbtns{margin-left:auto;display:flex;gap:8px;align-items:center}
.syncdot{font-size:11px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:5px;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font-size:16px}
.wrap{max-width:1000px;margin:-38px auto 60px;padding:0 16px}
.tabs{display:flex;gap:6px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:6px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:11px 8px;border-radius:12px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button.active{background:var(--ink);color:#fff}
body.dark .tabs button.active{background:var(--accent);color:#161616}
.view{display:none;margin-top:16px}
.view.active{display:block}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stat .num{font-size:26px;font-weight:800;font-family:Manrope}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.section-title{display:flex;align-items:center;gap:8px;margin:22px 0 10px;flex-wrap:wrap}
.section-title h2{font-size:16px}
.section-title .cnt{font-size:12px;color:var(--muted);background:var(--panel2);padding:3px 9px;border-radius:999px}
.empty{text-align:center;padding:28px 16px;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);border-radius:14px;font-size:13.5px}
.entrycard{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;position:relative;overflow:hidden}
.entrycard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.entrycard.exam::before{background:var(--purple)}
.entrycard.istoday{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.entrycard.exam.istoday{box-shadow:0 0 0 2px var(--purple),var(--shadow)}
.entrycard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-left:8px}
.subj{font-weight:800;font-size:15.5px}
.lec{font-size:12px;color:var(--muted);margin-top:2px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.typechip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.typechip.class{background:var(--blue-bg);color:var(--blue)}
.typechip.exam{background:var(--purple-bg);color:var(--purple)}
.branchchip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.todaychip{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:#161616}
.datepill{font-size:11.5px;color:var(--muted);background:var(--panel2);padding:4px 9px;border-radius:999px;white-space:nowrap}
.sentbadge{font-size:11px;color:var(--green);background:var(--green-bg);padding:3px 8px;border-radius:999px;font-weight:700}
.teacherrow{display:flex;gap:8px;align-items:center;margin:12px 0 10px;padding-left:8px}
.teacherrow select{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-left:8px}
.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.wa{background:var(--green-bg);color:var(--green)}
.btn.tg{background:var(--blue-bg);color:var(--blue)}
.btn.copy{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:#fff}
body.dark .btn.primary{background:var(--accent);color:#161616}
.btn.soft{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red-bg);color:var(--red)}
.btn.block{width:100%;justify-content:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px}
.toolbar .grow{flex:1;min-width:150px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--panel2);color:var(--muted);font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr.istoday td{background:rgba(239,125,26,.09)}
.rowbtn{border:0;background:transparent;padding:4px 6px;border-radius:8px;color:var(--muted)}
.rowbtn:hover{background:var(--panel2)}
.field{display:grid;gap:5px;margin-bottom:11px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 11px;width:100%}
.field textarea{min-height:100px;resize:vertical;font-family:inherit}
.modalback{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modalback.open{display:flex}
.modal{background:var(--panel);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
@media(min-width:640px){.modalback{align-items:center}.modal{border-radius:18px}}
.modal h3{margin-bottom:14px}
.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.teachercard{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 14px}
.teachercard b{font-size:14.5px}
.teachercard .sub{font-size:12px;color:var(--muted);margin-top:2px}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:800;color:var(--accent-dark);flex-shrink:0}
.toggle{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0}
.switch{width:44px;height:24px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;position:relative;flex-shrink:0}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.15s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on i{left:22px;background:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;display:none;z-index:100;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{display:block}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.divider{border:0;border-top:1px dashed var(--line);margin:14px 0}
.subhead{font-weight:800;font-size:14px;margin:4px 0 10px}
.chipbox{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.brchip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600}
.brchip button{border:0;background:var(--line);color:var(--ink);width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;display:grid;place-items:center}
footer.credit{display:flex;align-items:center;justify-content:center;padding:26px 0 10px;opacity:.6}
footer.credit img{height:26px}
</style>
</head>

    teachers:TEACHER_SEED.map((t,i)=>({id:'t'+(i+1),...t})),
    classes:CLASS_SEED.map((c,i)=>({id:'c'+(i+1),date:c[0],subject:c[1],lecture:c[2],time:'',branch:DEFAULT_BRANCH})),
    exams:EXAM_SEED.map((e,i)=>({id:'e'+(i+1),date:e[0],subject:e[1],examName:e[2],branch:DEFAULT_BRANCH})),
    reminderLog:[]
  };
}

/* ---------- storage: localStorage (always) + Firebase (optional live sync) ---------- */
let data=loadLocal();
let fbRef=null, fbReady=false, saveDebounce=null;

function loadLocal(){
  try{
    const raw=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(!raw) return seedData();
    migrate(raw);
    return raw;
  }catch(e){return seedData();}
}
function migrate(raw){
  if(!raw.branches||!raw.branches.length) raw.branches=[DEFAULT_BRANCH];
  if(!raw.settings.templates) raw.settings.templates={...DEFAULT_TEMPLATES};
  if(!raw.settings.address) raw.settings.address='ফার্মগেট, ঢাকা';
  if(!raw.exams) raw.exams=[];
  raw.teachers.forEach(t=>{if(!t.branch) t.branch=raw.branches[0];});
  raw.classes.forEach(c=>{if(!c.branch) c.branch=raw.branches[0]; if(c.time===undefined) c.time=''; delete c.note;});
  raw.exams.forEach(e=>{if(!e.branch) e.branch=raw.branches[0];});
  if((raw.settings.templatesVersion||1)<TEMPLATE_VERSION){
    const t=raw.settings.templates;
    const unmodified=(cur,olds)=>!cur||olds.some(o=>cur===o);
    if(unmodified(t.today,[OLD_DEFAULT_TEMPLATES.today,V3_DEFAULT_TEMPLATES.today,V5_DEFAULT_TEMPLATES.today])) t.today=DEFAULT_TEMPLATES.today;
    if(unmodified(t.tomorrow,[OLD_DEFAULT_TEMPLATES.tomorrow,V3_DEFAULT_TEMPLATES.tomorrow,V5_DEFAULT_TEMPLATES.tomorrow])) t.tomorrow=DEFAULT_TEMPLATES.tomorrow;
    if(unmodified(t.upcoming,[V3_DEFAULT_TEMPLATES.upcoming,V5_DEFAULT_TEMPLATES.upcoming])) t.upcoming=DEFAULT_TEMPLATES.upcoming;
    raw.settings.templatesVersion=TEMPLATE_VERSION;
  }
}
function saveLocalOnly(){localStorage.setItem(STORE_KEY,JSON.stringify(data));}
function save(){
  saveLocalOnly();
  if(FIREBASE_ENABLED && fbReady){
    clearTimeout(saveDebounce);
    saveDebounce=setTimeout(()=>{ fbRef.set(data).catch(err=>toast('সিঙ্ক ব্যর্থ হয়েছে — ইন্টারনেট চেক করুন')); },350);
  }
}
function setSyncDot(state){
  const el=document.getElementById('syncdot');
  if(!el) return;
  if(state==='live') el.innerHTML='🟢 লাইভ সিঙ্ক চালু';
  else if(state==='connecting') el.innerHTML='🟡 সংযোগ হচ্ছে...';
  else el.innerHTML='⚪ লোকাল মোড';
}
function initFirebase(){
  if(!FIREBASE_ENABLED){ setSyncDot('local'); return; }
  try{
    setSyncDot('connecting');
    firebase.initializeApp(FIREBASE_CONFIG);
    fbRef=firebase.database().ref(FIREBASE_PATH);
    fbRef.once('value').then(snap=>{
      if(!snap.exists()){
        fbRef.set(data); // first run: push local/seed data up
      }
      fbReady=true;
      fbRef.on('value',snap=>{
        const remote=snap.val();
        if(remote){ migrate(remote); data=remote; saveLocalOnly(); renderAll(); }
        setSyncDot('live');
      });
    }).catch(()=>{ setSyncDot('local'); toast('Firebase সংযোগ ব্যর্থ — লোকাল মোডে চলছে'); });
  }catch(e){ setSyncDot('local'); }
}

function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- helpers ---------- */
function bn(n){return String(n).replace(/[0-9]/g,d=>BN[d]);}
function toEnDigits(s){return String(s??'').replace(/[০-৯]/g,d=>String(BN.indexOf(d)));}
function firstNumber(s){const m=toEnDigits(s).match(/\d+/);return m?Number(m[0]):NaN;}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function pad2(n){return String(n).padStart(2,'0');}
function isoOf(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function todayISO(){return isoOf(new Date());}
function tomorrowISO(){const d=new Date();d.setDate(d.getDate()+1);return isoOf(d);}
function formatBn(iso){const d=new Date(iso+'T00:00:00');return `${bn(d.getDate())} ${MONTHS[d.getMonth()]}, ${DAYS[d.getDay()]}`;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2400);}

function subjectsList(){return [...new Set(data.teachers.map(t=>t.subject))];}
function teachersFor(subject,branch){return data.teachers.filter(t=>t.subject===subject && (!branch||t.branch===branch));}
function suggestTeacher(subject,lecture,branch){
  let cands=teachersFor(subject,branch);
  if(cands.length===0) cands=teachersFor(subject,null);
  if(cands.length===0) return null;
  if(cands.length===1) return cands[0];
  const num=firstNumber(lecture);
  if(!isNaN(num)){
    const m=cands.find(t=>num>=t.rangeFrom&&num<=t.rangeTo);
    if(m) return m;
  }
  return cands[0];
}
function classesOn(iso,branch){return data.classes.filter(c=>c.date===iso && (!branch||c.branch===branch)).sort((a,b)=>a.subject.localeCompare(b.subject,'bn'));}
function examsOn(iso,branch){return data.exams.filter(e=>e.date===iso && (!branch||e.branch===branch)).sort((a,b)=>a.subject.localeCompare(b.subject,'bn'));}
function upcomingGroupsFor(listFn,days,branch){
  const start=new Date();start.setDate(start.getDate()+1);
  const groups=[];
  for(let i=0;i<days;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const iso=isoOf(d);
    const list=listFn(iso,branch);
    if(list.length) groups.push({date:iso,list});
  }
  return groups;
}
function loggedToday(entryId){
  const t=todayISO();
  return data.reminderLog.find(l=>l.entryId===entryId && l.sentAt.slice(0,10)===t);
}

function waLink(phone,text){
  let p=(phone||'').replace(/\D/g,'');
  if(!p) return null;
  if(p.startsWith('0')) p='880'+p.slice(1);
  else if(!p.startsWith('880')) p='880'+p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}
function phoneDigits(phone){
  let p=(phone||'').replace(/\D/g,'');
  if(!p) return '';
  if(p.startsWith('0')) p='880'+p.slice(1);
  else if(!p.startsWith('880')) p='880'+p;
  return p;
}
function tgAppLink(username,phone,text){
  const u=(username||'').replace('@','').trim();
  if(u) return `tg://resolve?domain=${u}&text=${encodeURIComponent(text)}`;
  const p=phoneDigits(phone);
  if(p) return `tg://resolve?phone=${p}&text=${encodeURIComponent(text)}`;
  return `tg://msg_url?url=&text=${encodeURIComponent(text)}`;
}
function tgWebLink(username,phone,text){
  const u=(username||'').replace('@','').trim();
  if(u) return `https://t.me/${u}?text=${encodeURIComponent(text)}`;
  return `https://t.me/share/url?url=&text=${encodeURIComponent(text)}`;
}
function fillTemplate(tpl,ctx){return tpl.replace(/\{(\w+)\}/g,(m,k)=>ctx[k]!==undefined?ctx[k]:m);}
function buildMessage(kind,cls,teacherName){
  const tpl=data.settings.templates[kind]||DEFAULT_TEMPLATES[kind];
  const ctx={
    teacher: teacherName || '',
    subject: cls.subject,
    lecture: cls.lecture,
    date: formatBn(cls.date),
    timeline: cls.time ? `\n🕐 সময়ঃ ${cls.time}` : '',
    address: data.settings.address || '',
    org: data.settings.orgName
  };
  const msg=fillTemplate(tpl,ctx);
  return msg.replace(/[ \t]{2,}/g,' ').replace(/^ +| +$/gm,'');
}

function sendReminder(classId,kind,selId,mode){
  const cls=data.classes.find(c=>c.id===classId);
  if(!cls) return;
  const teacherId=document.getElementById(selId).value;
  const teacher=data.teachers.find(t=>t.id===teacherId);
  const msg=buildMessage(kind,cls,teacher?teacher.name:null);
  if(mode==='wa'){
    if(!teacher||!teacher.phone){toast('এই শিক্ষকের মোবাইল নম্বর নেই — সেটিংস থেকে যোগ করুন');return;}
    window.open(waLink(teacher.phone,msg),'_blank');
    logSent(classId,teacherId,'whatsapp');
  }else if(mode==='tgapp'||mode==='tgweb'){
    navigator.clipboard.writeText(msg).catch(()=>{});
    const username=teacher?teacher.telegram:'';
    const phone=teacher?teacher.phone:'';
    if(mode==='tgapp'){
      window.location.href=tgAppLink(username,phone,msg);
      toast(username?'মেসেজ কপি হয়েছে — Telegram অ্যাপ খোলা হচ্ছে':'মেসেজ কপি হয়েছে — নম্বর দিয়ে চেষ্টা করা হচ্ছে (Telegram Desktop থাকতে হবে)');
    }else{
      const link=tgWebLink(username,phone,msg);
      window.open(link,'_blank');
      toast(username?'মেসেজ কপি হয়েছে — Telegram Web খোলা হচ্ছে':'ইউজারনেম নেই বলে সরাসরি চ্যাট খোলা যায়নি — মেসেজ কপি হয়েছে, চ্যাট বেছে পেস্ট করুন');
    }
    logSent(classId,teacherId,mode==='tgapp'?'telegram-app':'telegram-web');
  }else{
    navigator.clipboard.writeText(msg).then(()=>toast('মেসেজ কপি হয়েছে')).catch(()=>toast('কপি করা যায়নি'));
    logSent(classId,teacherId,'copy');
  }
  renderAll();
}
function logSent(entryId,teacherId,mode){
  data.reminderLog.push({entryId,teacherId:teacherId||'',mode,sentAt:new Date().toISOString()});
  if(data.reminderLog.length>500) data.reminderLog=data.reminderLog.slice(-500);
  save();
}

function downloadImportDemo(kind){
  const demo = kind==='exam' ? [
    '2026-08-22, ইংরেজি, Memory Test, অনলাইন শাখা',
    '2026-08-29, বাংলা, CT-01, অনলাইন শাখা',
    '2026-09-19, হিসাববিজ্ঞান, CT-04, অনলাইন শাখা'
  ] : kind==='teacher' ? [
    'মোমিনুল ইসলাম, ইংরেজি, লেকচার ১-১২, 1, 12, 01626908670, , অনলাইন শাখা',
    'জামাল উদ্দিন রাজু, বাংলা, লেকচার ১-১১, 1, 11, 01521220350, , অনলাইন শাখা'
  ] : [
    '2026-08-22, ইংরেজি, ১, সন্ধ্যা ৭:১৫, অনলাইন শাখা',
    '2026-08-23, বাংলা, ২, সন্ধ্যা ৭:১৫, অনলাইন শাখা',

  ];

  const a=document.createElement('a');

  a.download=`bt-${kind}-import-demo.csv`;
  a.click();

function ensureBranch(name){
  const b=(name||'').trim();
  if(!b) return data.branches[0];
  if(!data.branches.includes(b)) data.branches.push(b);
  return b;
}
function importBulk(){
  const lines=document.getElementById('m-bulk').value.split('\n').map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0;
  if(importKind==='exam'){
    lines.forEach(line=>{
      const [date,subject,examName,branch]=line.split(',').map(p=>p.trim());
      if(!date||!subject||!examName||!/^\d{4}-\d{2}-\d{2}$/.test(date)){skipped++;return;}
      data.exams.push({id:uid('e'),date,subject,examName,branch:ensureBranch(branch)});
      added++;
    });
    save();closeModal();renderExams();
  }else if(importKind==='teacher'){
    lines.forEach(line=>{
      const [name,subject,rangeLabel,rf,rt,phone,telegram,branch]=line.split(',').map(p=>p.trim());
      if(!name||!subject){skipped++;return;}
      data.teachers.push({id:uid('t'),name,subject,rangeLabel:rangeLabel||'',rangeFrom:Number(rf)||1,rangeTo:Number(rt)||99,phone:phone||'',telegram:telegram||'',branch:ensureBranch(branch)});
      added++;
    });
    save();closeModal();renderTeachers();
  }else{
    lines.forEach(line=>{
      const [date,subject,lecture,time,branch]=line.split(',').map(p=>p.trim());
      if(!date||!subject||!/^\d{4}-\d{2}-\d{2}$/.test(date)){skipped++;return;}
      data.classes.push({id:uid('c'),date,subject,lecture:lecture||'',time:time||'',branch:ensureBranch(branch)});
      added++;
    });
    save();closeModal();renderClasses();
  }
  toast(`${bn(added)}টি যোগ হয়েছে${skipped?` • ${bn(skipped)}টি লাইন বাদ গেছে`:''}`);
}

      <div class="field"><label>আগামীকালের ক্লাসের টেমপ্লেট</label><textarea id="s-tpl-tomorrow">${esc(s.templates.tomorrow)}</textarea></div>
      <div class="field"><label>আসন্ন (পরবর্তী দিনগুলোর) ক্লাসের টেমপ্লেট</label><textarea id="s-tpl-upcoming">${esc(s.templates.upcoming||'')}</textarea></div>
      <button class="btn primary" onclick="saveTemplates()">টেমপ্লেট সংরক্ষণ করুন</button>
    </div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin-bottom:12px">ব্যাকআপ ও রিসেট</h3>
      <div class="actions" style="padding-left:0">
        <button class="btn soft" onclick="exportData()">⇩ ব্যাকআপ ডাউনলোড (JSON)</button>
        <label class="btn soft" style="cursor:pointer">⇧ ব্যাকআপ পুনরুদ্ধার<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
        <button class="btn red" onclick="resetData()">রিসেট (ডিফল্ট ডেটা)</button>
      </div>
    </div>
  `;
  renderBranchChips();
}
function renderBranchChips(){
  document.getElementById('branch-chips').innerHTML=data.branches.map(b=>`
    <div class="brchip">${esc(b)}${data.branches.length>1?`<button onclick="removeBranch('${esc(b).replace(/'/g,"\\'")}')">✕</button>`:''}</div>
  `).join('');
}
function addBranch(){
  const val=document.getElementById('s-newbranch').value.trim();
  if(!val){toast('শাখার নাম লিখুন');return;}
  if(data.branches.includes(val)){toast('এই শাখাটি আগে থেকেই আছে');return;}
  data.branches.push(val);
  save();renderSettings();toast('শাখা যোগ হয়েছে');
}
function removeBranch(name){
  if(data.branches.length<=1){toast('অন্তত একটি শাখা থাকতে হবে');return;}
  if(!confirm(`"${name}" শাখাটি মুছে ফেলবেন? এই শাখার ক্লাস/পরীক্ষা/শিক্ষক অন্য শাখায় স্থানান্তরিত হবে।`))return;
  data.branches=data.branches.filter(b=>b!==name);
  const fallback=data.branches[0];
  data.teachers.forEach(t=>{if(t.branch===name)t.branch=fallback;});
  data.classes.forEach(c=>{if(c.branch===name)c.branch=fallback;});
  data.exams.forEach(e=>{if(e.branch===name)e.branch=fallback;});
  save();renderSettings();toast('শাখা মুছে ফেলা হয়েছে');
}
function saveOrgSettings(){
  data.settings.orgName=document.getElementById('s-org').value.trim()||'Business Titan';
  data.settings.address=document.getElementById('s-address').value.trim();
  save();toast('সংরক্ষিত হয়েছে');
}
function saveTemplates(){
  data.settings.templates.today=document.getElementById('s-tpl-today').value;
  data.settings.templates.tomorrow=document.getElementById('s-tpl-tomorrow').value;
  data.settings.templates.upcoming=document.getElementById('s-tpl-upcoming').value;
  save();toast('টেমপ্লেট সংরক্ষিত হয়েছে');
}
function toggleTheme(){
  data.settings.theme=data.settings.theme==='dark'?'light':'dark';
  save();renderAll();
}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`bt-reminder-backup-${todayISO()}.json`;
  a.click();
}
function importData(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed.teachers||!parsed.classes) throw new Error('invalid');
      migrate(parsed);
      data=parsed;
      save();renderAll();toast('ব্যাকআপ পুনরুদ্ধার সম্পন্ন হয়েছে');
    }catch(err){toast('ফাইলটি সঠিক নয়');}
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('সব ডেটা মুছে ডিফল্ট রুটিন ও শিক্ষক তালিকায় ফিরে যাবে। নিশ্চিত?'))return;
  data=seedData();save();renderAll();toast('রিসেট সম্পন্ন হয়েছে');
}

/* ---------- modal ---------- */
function closeModal(){document.getElementById('modalback').classList.remove('open');}
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal();});

renderAll();
initFirebase();
</script>
</body>
</html>
